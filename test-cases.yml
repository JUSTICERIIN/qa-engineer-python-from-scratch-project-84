- summary: |
    Проверка возможности искать товары по ключевому слову
  requirement: |
    При вводе ключевого слова должен происходить поиск товаров 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Ключевое слово: "blender" (или любое другое из ассортимента)
  steps:
    - Жмем на поле "Поиск"
    - Вводим ключевое слово
  expected-result: |
    Должны появляться товары, соответствующие ключевому слову

- summary: |
    Проверка возможности искать товары по категории
  requirement: |
    При выборе категории должен происходить вывод товаров соответствующей категории 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Категория: "beauty"
  steps:
    - Жмем на кнопку "Категория"
    - Жмем на категорию "beauty"
  expected-result: |
    Должны появляться товары, соответствующие категории 

- summary: |
    Проверка возможности фильтровать товары по брендам
  requirement: |
    При выборе бренда должен происходить вывод товаров, соответствующих этому бренду 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Бренды: "Glamour Beauty", "Nail Couture"
  steps:
    - Жмем на поле "Glamour Beauty"
    - Жмем на поле "Nail Couture"
  expected-result: |
    Должны появиться товары, которые соответствуют только этим брендам

- summary: |
    Проверка возможности фильтровать товары по цене
  requirement: |
    При вводе цены должен происходить вывод товаров, соответствующих этим ценам 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Мин. цена: 50
    Макс. цена: 6577
  steps:
    - Жмем на поле "Цена"
    - Выбираем значение от 50 до 6577
  expected-result: |
    Должны появиться товары, которые соответствуют границам выбранной цены

- summary: |
    Проверка возможности просматривать товары
  requirement: |
    При открытии сайта должна открываться главная страница с товарами, которые можно просматривать 
  prerequisites: |
    Открыт браузер
  test-data: |
    URL: https://products-store.hexlet.app/
  steps:
    - Вводим URL сайта в поисковую строку
    - Жмем "Enter"
  expected-result: |
    Должна открыться главная страница с товарами

- summary: |
    Проверка возможности просматривать подробную информацию о товаре
  requirement: |
    При нажатии на товар должна открываться карточка товара и его описание 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Любой доступный товар (например, "Hand Blender")
  steps:
    - Жмем на карточку товара
  expected-result: |
    Должна появиться карточка товара и его подробное описание

- summary: |
    Проверка возможности добавлять товары в корзину
  requirement: |
    При добавлении товара в корзину он должен появиться в самой корзине
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Любой товар из наличия
  steps:
    - Выбираем товар
    - Жмем на кнопку "Add to cart"
  expected-result: |
    Товар должен добавиться в корзину

- summary: |
    Проверка возможности просматривать содержимое корзины
  requirement: |
    При нажатии на кнопку "Cart" должна открыться страница корзины
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Не требуются (или товар, добавленный на предыдущем шаге)
  steps:
    - Жмем на кнопку "Cart"
  expected-result: |
    Должна открыться страница корзины
    
- summary: |
    Проверка возможности переключать язык интерфейса
  requirement: |
    При выборе другого языка должен смениться язык страницы 
  prerequisites: |
    Открыта страница магазина
  test-data: |
    Язык: "Spanish"
  steps:
    - Жмем на кнопку "language"
    - Жмем на кнопку "Spanish"
  expected-result: |
    Язык сайта должен смениться на Испанский
