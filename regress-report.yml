bugreports:

- summary: |
    При выборе языка "Russian" переводится только часть интерфейса
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Нажать на вкладку/кнопку "Language"
    3. Выбрать "Russian"
  expected-result: |
    При выборе "Russian" весь интерфейс переводится на русский язык
  actual-result: |
    Не переводится карточка товара и его описание, не переводятся категории товаров, есть ошибки в переводе слов

- summary: |
    При выборе языка "Spanish" переводится только часть интерфейса
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Нажать на вкладку/кнопку "Language"
    3. Выбрать "Spanish"
  expected-result: |
    При выборе "Spanish" весь интерфейс переводится на русский язык
  actual-result: |
    Не переводится карточка товара и его описание, не переводятся категории товаров, есть ошибки в переводе слов
    
- summary: |
    В категории "Brand" присутствует пустое поле, доступное для выбора
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Перейти в категорию "Brand"
  expected-result: |
    В категории "Brand" отображаются только валидные бренды
  actual-result: |
    В списке категории "Brand" присутствует пустое поле, которое можно выбрать

- summary: |
    Не работает кнопка "X" для закрытия модального окна при оформлении заказа
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Открыть карточку любого товара
    3. Нажать "Add to cart"
    4. Нажать "Cart"
    5. Нажать "Checkout"
    6. В появившемся модальном окне нажать кнопку "X"
  expected-result: |
    Нажатие на кнопку "X" закрывает модальное окно оформления заказа
    Пользователь возвращается в корзину
  actual-result: |
    Кнопка "X" не реагирует на нажатие

- summary: |
    В корзине количество добавленных товаров не выровнено по столбцу
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Добавить в корзину несколько разных товаров через "Add to cart"
    3. Нажать "Cart"
    4. Открыть корзину и проверить колонку с колличеством товаров
    5. Жмем на кнопку "Checkout"
    6. В открывшемся модальном окне проверить колонку с колличеством товаров
  expected-result: |
    Значения количества во всех строках корзины а так же в модальном окне выровнены по одной вертикали
  actual-result: |
    Визуально колонка с колличеством не выровнена
