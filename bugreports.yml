- summary: |
    В категории "Brand" присутствует пустое поле, доступное для выбора
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Перейти в категорию "Brand"
  expected-result: |
    В категории "Brand" отображаются только валидные бренды
  actual-result: |
    В списке категории "Brand" присутствует пустое поле, которое можно выбрать

- summary: |
    Не работает кнопка "X" для закрытия модального окна при оформлении заказа
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Открыть карточку любого товара
    3. Нажать "Add to cart"
    4. Нажать "Cart"
    5. Нажать "Checkout"
    6. В появившемся модальном окне нажать кнопку "X"
  expected-result: |
    Нажатие на кнопку "X" закрывает модальное окно оформления заказа
    Пользователь возвращается в корзину
  actual-result: |
    Кнопка "X" не реагирует на нажатие

- summary: |
    В корзине количество добавленных товаров не выровнено по столбцу
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Добавить в корзину несколько разных товаров через "Add to cart"
    3. Нажать "Cart"
    4. Открыть корзину и проверить колонку с колличеством товаров
  expected-result: |
    Значения количества во всех строках корзины выровнены по одной вертикали
  actual-result: |
    Визуально колонка с колличеством не выровнена

- summary: |
    На главной странице есть кнопкка "Previous" которая при нажатии ничего не делает
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
  expected-result: |
    Кнопки не должно там быть
  actual-result: |
    Кнопка есть и она не работает

- summary: |
    В карточке товара гиперссылка категории товара не работает
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Открыть карточку "Hand Blender"
    3. Жмем на гиперссылку "#kitchen-accessories"
  expected-result: |
    Должна открыться страница с товарами относящиеся к этой категории
  actual-result: |
    Кнопка при нажатии ничего не делает

