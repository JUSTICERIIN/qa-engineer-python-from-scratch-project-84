- summary: |
    В выпадающем списке языков "English" отображается дважды
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Нажать на вкладку/кнопку "Language"
    3. Открыть выпадающий список языков
    Ошибка воспроизводится на шаге 3: в списке два пункта "English"
  expected-result: |
    В списке языков каждый язык присутствует ровно один раз
  actual-result: |
    В выпадающем списке языков "English" отображается дважды

- summary: |
    При выборе языка "Spanish" переводится только часть интерфейса
  environment: |
    Firefox 160.0 (64-разрядная)
    Windows 22H2
  steps-to-reproduce: |
    1. Открыть сайт https://products-store.hexlet.app/
    2. Нажать на вкладку/кнопку "Language"
    3. Выбрать "Spanish"
  expected-result: |
    При выборе "Spanish" весь согласованный интерфейс переводится на русский язык
  actual-result: |
    Не переводится карточка товара и его описание, не переводятся категории товаров, есть ошибки в переводе слов

